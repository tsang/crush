name: lint
on:
  push:
    branches: [main]
  pull_request:

# The reusable lint workflow asks for checks:write to annotate PRs. Forks
# default to a read-only token, and a caller whose permissions fall short of
# the callee's request fails validation at startup, so declare the same
# scopes here that charmbracelet/meta's lint.yml declares.
permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint:
    uses: charmbracelet/meta/.github/workflows/lint.yml@main
    with:
      golangci_path: .golangci.yml
      golangci_version: v2.13.1
      timeout: 10m
